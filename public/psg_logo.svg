<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="psgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="psgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring with Shield Cog -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="100" r="90" fill="url(#psgBlue)" stroke="url(#psgGold)" stroke-width="6"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="url(#psgGold)" stroke-width="2" stroke-dasharray="8 4"/>
  </g>

  <!-- Shield Emblem -->
  <path d="M 100 35 L 145 60 L 145 115 Q 100 160 100 160 Q 55 115 55 60 Z" fill="url(#psgBlue)" stroke="url(#psgGold)" stroke-width="3" filter="url(#shadow)"/>

  <!-- Golden Emblem Text PSG -->
  <text x="100" y="95" font-family="'Inter', sans-serif" font-weight="900" font-size="32" fill="url(#psgGold)" text-anchor="middle" letter-spacing="2">PSG</text>
  <text x="100" y="115" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">POLYTECHNIC</text>
  
  <!-- Established Star -->
  <path d="M 100 128 L 103 134 L 109 135 L 105 139 L 106 145 L 100 142 L 94 145 L 95 139 L 91 135 L 97 134 Z" fill="url(#psgGold)"/>
  
  <!-- Outer Banner Arc Text -->
  <path id="textArc" d="M 25 100 A 75 75 0 1 1 175 100" fill="none"/>
  <text font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="url(#psgGold)" letter-spacing="2">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      PSG POLYTECHNIC COLLEGE
    </textPath>
  </text>
</svg>
